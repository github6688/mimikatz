name: Build Mimikatz

on:
  workflow_dispatch: # 允许你手动点击按钮触发编译

jobs:
  build:
    runs-on: windows-2022 # 使用 GitHub 提供的 Windows Server 2022 云服务器

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 编译 64 位版本（跳过驱动项目，防止报错断开）
    - name: Build x64 Release
      run: |
        msbuild mimikatz.sln /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0 /p:TargetedFrameworkVersion=v4.5 /t:mimikatz

    # 编译 32 位版本（跳过驱动项目，防止报错断开）
    - name: Build Win32 Release
      run: |
        msbuild mimikatz.sln /p:Configuration=Release /p:Platform=Win32 /p:WindowsTargetPlatformVersion=10.0 /p:TargetedFrameworkVersion=v4.5 /t:mimikatz

    # 打包并上传生成的 exe 文件
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mimikatz-built-binaries
        path: |
          x64/mimikatz.exe
          Win32/mimikatz.exe
