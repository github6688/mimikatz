name: Build Mimikatz

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Add Workspace to Defender Exclusion
      run: |
        # 将当前工作目录加入排除项，防止编译产物被实时扫描拦截
        Set-MpPreference -ExclusionPath "${{ github.workspace }}"
        Write-Host "Workspace '${{ github.workspace }}' added to Defender exclusion list."

    - name: Build x64 Release
      run: |
        # 🟢 关键修正：
        # 1. /p:PlatformToolset=v143 -> 强行升级工具集，不再寻找找不到的 v141_xp
        # 2. /p:WindowsTargetPlatformVersion=10.0 -> 自动匹配云端最新的 Win10/11 SDK
        # 3. /t:mimikatz -> 仅编译主项目
        msbuild mimikatz.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /t:mimikatz

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mimikatz-x64
        path: |
          x64/**/*.exe
          x64/**/*.dll
        retention-days: 1
