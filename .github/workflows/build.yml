name: Build Mimikatz

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Add Workspace to Defender Exclusion
      run: |
        # 将当前工作目录加入排除项，防止编译产物被实时扫描拦截
        Set-MpPreference -ExclusionPath "${{ github.workspace }}"
        Write-Host "Workspace '${{ github.workspace }}' added to Defender exclusion list."

    - name: Build x64 Release
      run: |
        # 直接进行编译！/t:mimikatz 确保只编译主项目
        # 强制指定 /p:WindowsTargetPlatformVersion=10.0 让 MSBuild 自动匹配最新的 SDK
        msbuild mimikatz.sln /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0 /t:mimikatz

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mimikatz-x64
        # 通配符路径：完美兼容并捕获 x64 目录下生成的任何 exe 和 dll
        path: |
          x64/**/*.exe
          x64/**/*.dll
        retention-days: 1
